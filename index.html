                            <label for="title"><b>Title</b></label>
                            <input class="form-control mb-4" id="title" type="text" placeholder="Enter post title">

                            <textarea class="form-control mb-4" name="" id="content"
                                placeholder="Enter post content"></textarea>

                            <div class="d-flex justify-content-between">

                                    <button id="updateBtn" type="button"
                                        class="btn shadow border btn-primary d-none"><b>Update</b></button>
                                </div>
                                <div>
                                    <button id="clearBtn" type="button"
                                        class="btn shadow border btn-danger"><b>Clear</b></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

            <div class="col-10 offset-1 mt-5">
